[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsored-ads-decision-lab"
version = "0.1.0"
description = "A reproducible sponsored-ads decision engine with explicitly simulated auction inputs."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ml = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2", "lightgbm>=4,<5", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
